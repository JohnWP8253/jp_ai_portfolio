<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="John Pendergrass — AI Practitioner, Certified ScrumMaster, and Educator. Building at the intersection of machine learning and human learning." />
    <title>John Pendergrass</title>
    <script>
      // GH Pages SPA redirect: restore path from query string
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        var search = window.location.search;
        if (search.indexOf('p=/') !== -1) {
          var path = search.slice(1).split('&').reduce(function(o, q) {
            var a = q.split('='); o[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&'); return o;
          }, {});
          if (path.p !== undefined) {
            window.history.replaceState(
              null, null,
              window.location.pathname.slice(0, -1) + (path.p || '') +
              (path.q ? '?' + path.q : '') +
              window.location.hash
            );
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
